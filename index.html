<style>
  :root {
    --bg-dark: #0f172a;
    --bg-darker: #020617;
    --surface-card: #1e293b;
    --surface-hover: #334155;
    --text-light: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #06b6d4;
    --accent-hover: #0891b2;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-darker); }
  .container { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
  
  .header { 
    text-align: center; margin-bottom: 1.5rem;
    padding: 1.5rem; background: var(--surface-card);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  }
  .header h1 { 
    margin: 0 0 0.5rem; font-size: 28px; font-weight: 600;
    color: var(--text-light);
  }
  .header p { 
    margin: 0; font-size: 15px; color: var(--text-muted);
  }
  
  .tabs {
    display: flex; gap: 8px; margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  
  .tab-btn {
    padding: 10px 16px; font-size: 14px; font-weight: 600;
    background: var(--surface-card); color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
    cursor: pointer; transition: all 0.2s;
  }
  
  .tab-btn.active {
    background: var(--accent); color: white;
    border-color: var(--accent);
  }
  
  .tab-btn:hover:not(.active) {
    background: var(--surface-hover);
    border-color: rgba(255,255,255,0.2);
  }
  
  .controls {
    display: grid; 
    grid-template-columns: 1fr;
    gap: 12px; margin-bottom: 1.5rem;
  }
  
  .search-btn {
    padding: 12px 20px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: white;
    border: none; border-radius: 8px;
    cursor: pointer; transition: background 0.2s;
  }
  .search-btn:hover { background: var(--accent-hover); }
  .search-btn:active { transform: scale(0.98); }
  
  .filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  
  .filter-box {
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; color: var(--text-muted);
    background: var(--surface-card); padding: 12px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  }
  
  .filter-box label {
    font-weight: 600; white-space: nowrap;
  }
  
  select {
    padding: 8px 12px; font-size: 14px;
    background: var(--bg-dark); color: var(--text-light);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; cursor: pointer;
    flex: 1;
  }
  
  .status-msg {
    font-size: 14px; color: var(--text-muted);
    text-align: center; margin-bottom: 1.5rem; min-height: 20px;
  }
  
  .games-grid {
    display: grid; 
    grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 2rem;
  }
  
  .game-card {
    background: var(--surface-card); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    display: flex; flex-direction: column;
  }
  .game-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 16px rgba(6, 182, 212, 0.2);
  }
  
  .game-thumbnail {
    width: 100%; height: 120px;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1e293b, #334155);
  }
  
  .hot-badge {
    position: absolute; top: 8px; left: 8px;
    background: #dc2626; color: white;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    animation: pulse 1.5s infinite;
    z-index: 2;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .discount-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: #10b981; color: white;
    padding: 6px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    z-index: 2;
  }
  
  .wishlist-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.4); border: none;
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 16px;
    transition: all 0.2s;
    z-index: 3;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  
  .wishlist-btn:hover { 
    background: rgba(6, 182, 212, 0.8);
    transform: scale(1.15);
  }
  
  .game-content { 
    padding: 12px; 
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  
  .game-title {
    margin: 0 0 4px; font-size: 14px; font-weight: 600;
    color: var(--text-light); line-height: 1.3;
  }
  
  .game-desc {
    font-size: 12px; color: var(--text-muted);
    line-height: 1.4; margin-bottom: 6px;
    min-height: 24px;
  }
  
  .game-meta-info {
    font-size: 11px; color: var(--text-muted);
    background: var(--bg-dark); padding: 4px 6px;
    border-radius: 6px; margin-bottom: 6px;
    border: 1px solid rgba(255,255,255,0.05);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
  }
  
  .meta-item {
    padding: 2px;
  }
  
  .game-genre {
    font-size: 10px; color: var(--accent);
    background: rgba(6, 182, 212, 0.15);
    padding: 2px 5px;
    border-radius: 3px; display: inline-block; margin-bottom: 6px;
    border: 1px solid rgba(6, 182, 212, 0.3);
  }
  
  .game-stats {
    display: flex; justify-content: space-between;
    gap: 6px; font-size: 11px; margin-bottom: 6px;
  }
  
  .stat {
    display: flex; align-items: center; gap: 2px;
  }
  .stat-label { color: var(--text-muted); }
  .stat-value { color: var(--text-light); font-weight: 600; }
  
  .price-section {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 6px; display: flex;
    justify-content: space-between; align-items: center;
    margin-top: auto;
  }
  
  .prices {
    display: flex; align-items: baseline; gap: 4px;
  }
  
  .price-now {
    font-size: 14px; font-weight: 700;
    color: #10b981;
  }
  
  .price-old {
    font-size: 11px; color: var(--text-muted);
    text-decoration: line-through;
  }
  
  .buy-btn {
    padding: 6px 10px; font-size: 11px; font-weight: 600;
    background: var(--accent); color: white;
    border: none; border-radius: 6px; cursor: pointer;
    transition: background 0.2s;
  }
  .buy-btn:hover { background: var(--accent-hover); }
  
  .pagination {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin-top: 2rem; flex-wrap: wrap;
  }
  
  .page-info {
    font-size: 14px; font-weight: 600; color: var(--text-light);
  }
  
  .loadmore-btn {
    padding: 10px 20px; font-size: 14px; font-weight: 600;
    background: var(--surface-card); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; cursor: pointer;
    transition: all 0.2s; color: var(--text-light);
  }
  .loadmore-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--surface-hover);
  }
  .loadmore-btn:disabled {
    opacity: 0.5; cursor: not-allowed;
  }
  
  .empty {
    text-align: center; padding: 2rem 1rem;
    color: var(--text-muted);
    grid-column: 1 / -1;
  }
  
  @media (max-width: 1200px) {
    .games-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  
  @media (max-width: 768px) {
    .games-grid {
      grid-template-columns: 1fr;
    }
    .filter-row {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="container">
  <div class="header">
    <h1>🎮 게임 핫딜 찾기</h1>
    <p>PC에서 한 눈에 12개의 멋진 게임 할인을 비교해보세요!</p>
  </div>
  
  <div class="tabs">
    <button class="tab-btn active" data-tab="hotdeals">🔥 핫딜</button>
    <button class="tab-btn" data-tab="trending">🌟 트렌딩</button>
    <button class="tab-btn" data-tab="new">✨ 새 게임</button>
    <button class="tab-btn" data-tab="wishlist">❤️ 찜한 게임</button>
  </div>
  
  <div class="controls">
    <button class="search-btn" id="searchBtn">🔥 핫딜 검색</button>
    
    <div class="filter-row">
      <div class="filter-box">
        <label for="sortBy">📊 정렬:</label>
        <select id="sortBy">
          <option value="discount">할인율 높은순</option>
          <option value="price-low">가격 낮은순</option>
          <option value="price-high">가격 높은순</option>
          <option value="rating">평가 높은순</option>
          <option value="popularity">인기순</option>
        </select>
      </div>
      
      <div class="filter-box">
        <label for="filterGenre">🎮 장르:</label>
        <select id="filterGenre">
          <option value="">전체 게임</option>
          <option value="action">액션</option>
          <option value="rpg">RPG</option>
          <option value="puzzle">퍼즐</option>
          <option value="strategy">전략</option>
          <option value="adventure">모험</option>
          <option value="indie">인디</option>
        </select>
      </div>
    </div>
  </div>
  
  <div class="status-msg" id="statusMsg"></div>
  
  <div class="games-grid" id="gamesGrid"></div>
  
  <div class="pagination" id="pagination"></div>
</div>

<script>
  const gameIcons = {
    'baldurs_gate_3': '🧙',
    'elden_ring': '⚔️',
    'hades': '🔥',
    'portal_2': '🌀',
    'stardew_valley': '🌾',
    'outer_wilds': '🚀',
    'celeste': '⛰️',
    'journey': '🏜️',
    'hollow_knight': '⚫',
    'factorio': '🏭',
    'spiritfarer': '🚢',
    'gris': '🎨',
    'the_witness': '🧩',
    'civilization_vi': '👑',
  };

  const gameGradients = {
    'baldurs_gate_3': 'linear-gradient(135deg, #5b21b6, #3b2667)',
    'elden_ring': 'linear-gradient(135deg, #991f1f, #1c1c2e)',
    'hades': 'linear-gradient(135deg, #f97316, #2d1b2e)',
    'portal_2': 'linear-gradient(135deg, #06b6d4, #1e40af)',
    'stardew_valley': 'linear-gradient(135deg, #fbbf24, #b8860b)',
    'outer_wilds': 'linear-gradient(135deg, #0ea5e9, #1c1636)',
    'celeste': 'linear-gradient(135deg, #ec4899, #6b21a8)',
    'journey': 'linear-gradient(135deg, #f59e0b, #92400e)',
    'hollow_knight': 'linear-gradient(135deg, #6366f1, #1a1a2e)',
    'factorio': 'linear-gradient(135deg, #dc2626, #7c2d12)',
    'spiritfarer': 'linear-gradient(135deg, #60a5fa, #1e3a8a)',
    'gris': 'linear-gradient(135deg, #8b5cf6, #312e81)',
    'the_witness': 'linear-gradient(135deg, #f59e0b, #daa520)',
    'civilization_vi': 'linear-gradient(135deg, #fcd34d, #991f1f)',
  };

  const genres = {
    action: '액션', rpg: 'RPG', puzzle: '퍼즐',
    strategy: '전략', adventure: '모험', indie: '인디'
  };

  const topGames = [
    { id: 'baldurs_gate_3', title: 'Baldur\'s Gate 3', genre: 'rpg', original: 59.99, price: 35.99, discount: 40, rating: 4.9, reviews: 18000, popularity: 98, desc: '무한한 가능성의 판타지 RPG', playTime: '100+시간', dev: 'Larian', features: 'RPG, 멀티', url: 'https://store.steampowered.com/app/1238140/', isNew: true, prevPrice: 49.99 },
    { id: 'elden_ring', title: 'Elden Ring', genre: 'action', original: 59.99, price: 29.99, discount: 50, rating: 4.8, reviews: 15000, popularity: 96, desc: '광활한 세계의 도전적 액션', playTime: '60-100시간', dev: 'FromSoftware', features: '액션, 멀티', url: 'https://store.steampowered.com/app/570940/', isNew: false, prevPrice: 39.99 },
    { id: 'hades', title: 'Hades', genre: 'action', original: 24.99, price: 7.49, discount: 70, rating: 4.9, reviews: 14000, popularity: 94, desc: '지옥에서 탈출하는 로그라이크', playTime: '30-50시간', dev: 'Supergiant', features: '로그라이크, 액션', url: 'https://store.steampowered.com/app/1145360/', isNew: false, prevPrice: 12.49 },
    { id: 'portal_2', title: 'Portal 2', genre: 'puzzle', original: 19.99, price: 4.99, discount: 75, rating: 4.9, reviews: 12000, popularity: 92, desc: '포탈 퍼즐의 고전', playTime: '8-10시간', dev: 'Valve', features: '퍼즐, 스토리', url: 'https://store.steampowered.com/app/620/', isNew: false, prevPrice: 6.99 },
    { id: 'stardew_valley', title: 'Stardew Valley', genre: 'adventure', original: 14.99, price: 7.49, discount: 50, rating: 4.9, reviews: 8543, popularity: 95, desc: '소박한 농장 경영 시뮬레이션', playTime: '50-100시간', dev: 'ConcernedApe', features: '시뮬레이션, 로맨스', url: 'https://store.steampowered.com/app/413150/', isNew: false, prevPrice: 9.99 },
    { id: 'outer_wilds', title: 'Outer Wilds', genre: 'adventure', original: 24.99, price: 7.49, discount: 70, rating: 4.9, reviews: 8432, popularity: 90, desc: '우주 탐험의 신비한 퍼즐', playTime: '20-30시간', dev: 'Mobius Digital', features: '탐험, 과학', url: 'https://store.steampowered.com/app/753640/', isNew: true, prevPrice: 11.99 },
    { id: 'celeste', title: 'Celeste', genre: 'action', original: 19.99, price: 5.99, discount: 70, rating: 4.9, reviews: 9876, popularity: 91, desc: '산을 오르는 도전적 플랫포머', playTime: '8-15시간', dev: 'Maddy Makes', features: '플랫포머, 도전', url: 'https://store.steampowered.com/app/504230/', isNew: false, prevPrice: 8.99 },
    { id: 'journey', title: 'Journey', genre: 'adventure', original: 11.99, price: 5.99, discount: 50, rating: 4.9, reviews: 11234, popularity: 89, desc: '모래 언덕의 감정적 모험', playTime: '2-3시간', dev: 'thatgamecompany', features: '모험, 예술', url: 'https://store.steampowered.com/app/638230/', isNew: false, prevPrice: 7.99 },
    { id: 'hollow_knight', title: 'Hollow Knight', genre: 'action', original: 14.99, price: 7.49, discount: 50, rating: 4.8, reviews: 6521, popularity: 88, desc: '깊은 세계의 메트로배니아', playTime: '20-40시간', dev: 'Team Cherry', features: '탐험, 도전', url: 'https://store.steampowered.com/app/367520/', isNew: false, prevPrice: 8.99 },
    { id: 'factorio', title: 'Factorio', genre: 'strategy', original: 29.99, price: 14.99, discount: 50, rating: 4.8, reviews: 5432, popularity: 85, desc: '공장 건설의 중독성 강한 전략', playTime: '100시간+', dev: 'Wube Software', features: '건설, 자동화', url: 'https://store.steampowered.com/app/427520/', isNew: false, prevPrice: 19.99 },
    { id: 'spiritfarer', title: 'Spiritfarer', genre: 'adventure', original: 16.99, price: 5.09, discount: 70, rating: 4.8, reviews: 7234, popularity: 86, desc: '영혼을 돕는 따뜻한 모험', playTime: '10-15시간', dev: 'Thunder Lotus', features: '모험, 관리', url: 'https://store.steampowered.com/app/972660/', isNew: false, prevPrice: 8.49 },
    { id: 'gris', title: 'Gris', genre: 'indie', original: 14.99, price: 4.49, discount: 70, rating: 4.8, reviews: 6234, popularity: 83, desc: '아름다운 색감의 예술 게임', playTime: '3-4시간', dev: 'Nomada Studio', features: '미술, 감정', url: 'https://store.steampowered.com/app/683320/', isNew: false, prevPrice: 7.49 },
    { id: 'the_witness', title: 'The Witness', genre: 'puzzle', original: 39.99, price: 9.99, discount: 75, rating: 4.7, reviews: 4200, popularity: 78, desc: '신비한 섬의 깊이있는 퍼즐', playTime: '40-80시간', dev: 'Jonathan Blow', features: '퍼즐, 탐험', url: 'https://store.steampowered.com/app/257200/', isNew: false, prevPrice: 14.99 },
  ];

  const allGames = [...topGames];

  for (let i = 0; i < 75; i++) {
    const base = allGames[i % allGames.length];
    const genreList = Object.keys(genres);
    const randomGenre = genreList[Math.floor(Math.random() * genreList.length)];
    allGames.push({
      ...base,
      title: `${base.title.split('(')[0].split('v')[0].trim()} v${i + 2}`,
      genre: randomGenre,
      discount: Math.max(40, base.discount - Math.floor(Math.random() * 20)),
      rating: Math.max(3.5, base.rating - Math.random() * 0.5),
      reviews: base.reviews + Math.floor(Math.random() * 5000),
      isNew: Math.random() > 0.7,
      prevPrice: base.original - Math.random() * 10,
      url: base.url + (i % 5)
    });
  }

  let currentPage = 0;
  let displayedGames = [];
  let currentTab = 'hotdeals';
  let wishlist = JSON.parse(localStorage.getItem('gameWishlist') || '[]');

  function renderGames() {
    const grid = document.getElementById('gamesGrid');
    const start = currentPage * 12;
    const end = start + 12;
    const games = displayedGames.slice(start, end);

    if (games.length === 0) {
      grid.innerHTML = '<div class="empty"><div style="font-size: 40px; margin-bottom: 10px;">🎮</div>게임을 검색해주세요!</div>';
      return;
    }

    grid.innerHTML = games.map((g) => {
      const isHotDeal = g.discount >= 70;
      const isWishlisted = wishlist.includes(g.title);
      const wishlistIcon = isWishlisted ? '❤️' : '🤍';
      const bgGradient = gameGradients[g.id] || 'linear-gradient(135deg, #1e293b, #334155)';
      const icon = gameIcons[g.id] || '🎮';
      
      return `
        <div class="game-card">
          <div class="game-thumbnail" style="background: ${bgGradient}">
            <div style="font-size: 48px;">${icon}</div>
            ${isHotDeal ? '<div class="hot-badge">🔥 HOT</div>' : ''}
            <button class="wishlist-btn" title="${isWishlisted ? '찜 해제' : '찜하기'}"
              onclick="toggleWishlist('${g.title}', event)">${wishlistIcon}</button>
            <div class="discount-badge">${g.discount}%</div>
          </div>
          <div class="game-content">
            ${g.isNew ? '<div class="game-genre" style="background: rgba(249, 115, 22, 0.2); border-color: rgba(249, 115, 22, 0.5); color: #fb923c;">NEW</div>' : '<div class="game-genre">' + genres[g.genre] + '</div>'}
            <div class="game-title">${g.title}</div>
            <div class="game-desc">${g.desc}</div>
            
            <div class="game-meta-info">
              <div class="meta-item"><span style="color: var(--text-muted);">⏱️</span> ${g.playTime}</div>
              <div class="meta-item"><span style="color: var(--text-muted);">👤</span> ${g.dev}</div>
            </div>
            
            <div class="game-stats">
              <div class="stat"><span class="stat-label">⭐</span><span class="stat-value">${g.rating.toFixed(1)}</span></div>
              <div class="stat"><span class="stat-label">👥</span><span class="stat-value">${(g.reviews / 1000).toFixed(1)}k</span></div>
            </div>
            
            <div class="price-section">
              <div class="prices">
                <div class="price-now">$${g.price.toFixed(2)}</div>
                <div class="price-old">$${g.original.toFixed(2)}</div>
              </div>
              <button class="buy-btn" onclick="buyGame('${g.url}')">구매</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    updatePagination();
  }

  function updatePagination() {
    const total = displayedGames.length;
    const pages = Math.ceil(total / 12);
    const pag = document.getElementById('pagination');

    pag.innerHTML = `
      <div class="page-info">페이지 ${currentPage + 1} / ${pages} (총 ${total}개)</div>
      <button class="loadmore-btn" 
        onclick="loadMore()"
        ${currentPage >= pages - 1 ? 'disabled' : ''}>
        ${currentPage >= pages - 1 ? '마지막 페이지입니다' : '더보기 (다음 12개)'}
      </button>
    `;
  }

  function loadMore() {
    const total = displayedGames.length;
    if ((currentPage + 1) * 12 < total) {
      currentPage++;
      renderGames();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function buyGame(url) {
    window.open(url, '_blank');
  }

  function toggleWishlist(title, event) {
    event.stopPropagation();
    const index = wishlist.indexOf(title);
    if (index > -1) {
      wishlist.splice(index, 1);
    } else {
      wishlist.push(title);
    }
    localStorage.setItem('gameWishlist', JSON.stringify(wishlist));
    renderGames();
  }

  function sortAndFilter() {
    const sortBy = document.getElementById('sortBy').value;
    const genre = document.getElementById('filterGenre').value;

    let filtered = allGames.filter(g => !genre || g.genre === genre);

    if (currentTab === 'hotdeals') {
      filtered = filtered.filter(g => g.discount >= 50);
    } else if (currentTab === 'trending') {
      filtered = filtered.sort((a, b) => b.popularity - a.popularity);
    } else if (currentTab === 'new') {
      filtered = filtered.filter(g => g.isNew);
    } else if (currentTab === 'wishlist') {
      filtered = filtered.filter(g => wishlist.includes(g.title));
    }

    filtered.sort((a, b) => {
      if (sortBy === 'discount') return b.discount - a.discount;
      if (sortBy === 'price-low') return a.price - b.price;
      if (sortBy === 'price-high') return b.price - a.price;
      if (sortBy === 'rating') return b.rating - a.rating;
      if (sortBy === 'popularity') return b.popularity - a.popularity;
      return 0;
    });

    displayedGames = filtered;
    currentPage = 0;
    renderGames();
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentTab = this.dataset.tab;
      currentPage = 0;
      sortAndFilter();
    });
  });

  document.getElementById('searchBtn').addEventListener('click', function() {
    const status = document.getElementById('statusMsg');
    status.textContent = '🎮 오늘의 핫딜을 검색 중...';
    
    setTimeout(() => {
      currentTab = 'hotdeals';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-tab="hotdeals"]').classList.add('active');
      sortAndFilter();
      status.textContent = `✨ ${displayedGames.length}개의 게임 할인정보를 찾았어요!`;
    }, 600);
  });

  document.getElementById('sortBy').addEventListener('change', sortAndFilter);
  document.getElementById('filterGenre').addEventListener('change', sortAndFilter);

  sortAndFilter();
</script>
