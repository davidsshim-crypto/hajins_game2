  :root {

    --bg-darker: #020617;
    --surface-card: #1e293b;
    --surface-hover: #334155;
    --text-light: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #06b6d4;
    --accent-hover: #0891b2;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-darker); }
  .container { padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
  
  .header { 
    text-align: center; margin-bottom: 1.5rem;
    padding: 1.5rem; background: var(--surface-card);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
  }
  .header h1 { 
    margin: 0 0 0.5rem; font-size: 28px; font-weight: 600;
    color: var(--text-light);
  }
  .header p { 
    margin: 0; font-size: 15px; color: var(--text-muted);
  }
  
  .tabs {
    display: flex; gap: 8px; margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  
  .tab-btn {
    padding: 10px 16px; font-size: 14px; font-weight: 600;
    background: var(--surface-card); color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius);
    cursor: pointer; transition: all 0.2s;
  }
  
  .tab-btn.active {
    background: var(--accent); color: white;
    border-color: var(--accent);
  }
  
  .tab-btn:hover:not(.active) {
    background: var(--surface-hover);
    border-color: rgba(255,255,255,0.2);
  }
  
  .controls {
    display: grid; 
    grid-template-columns: 1fr;
    gap: 12px; margin-bottom: 1.5rem;
  }
  
  .search-btn {
    padding: 12px 20px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: white;
    border: none; border-radius: var(--radius);
    cursor: pointer; transition: background 0.2s;
  }
  .search-btn:hover { background: var(--accent-hover); }
  .search-btn:active { transform: scale(0.98); }
  
  .filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  
  .filter-box {
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; color: var(--text-muted);
    background: var(--surface-card); padding: 12px;
    border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.1);
  }
  
  .filter-box label {
    font-weight: 600; white-space: nowrap;
  }
  
  select {
    padding: 8px 12px; font-size: 14px;
    background: var(--bg-dark); color: var(--text-light);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius); cursor: pointer;
    flex: 1;
  }
  
  .status-msg {
    font-size: 14px; color: var(--text-muted);
    text-align: center; margin-bottom: 1.5rem; min-height: 20px;
  }
  
  .games-grid {
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px; margin-bottom: 2rem;
  }
  
  .game-card {
    background: var(--surface-card); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    display: flex; flex-direction: column;
  }
  .game-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 16px rgba(6, 182, 212, 0.2);
  }
  
  .game-thumbnail {
    width: 100%; height: 140px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; position: relative; overflow: hidden;
    background-size: cover; background-position: center;
  }
  
  .pattern-fallback {
    background: linear-gradient(135deg, #1e293b, #334155);
  }
  
  .hot-badge {
    position: absolute; top: 8px; left: 8px;
    background: #dc2626; color: white;
    padding: 6px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
    animation: pulse 1.5s infinite;
    z-index: 2;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .discount-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: #10b981; color: white;
    padding: 8px 12px; border-radius: var(--radius);
    font-size: 13px; font-weight: 600;
    z-index: 2;
  }
  
  .wishlist-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.4); border: none;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 18px;
    transition: all 0.2s;
    z-index: 3;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  
  .wishlist-btn:hover { 
    background: rgba(6, 182, 212, 0.8);
    transform: scale(1.15);
  }
  
  .game-content { 
    padding: 12px; 
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  
  .game-title {
    margin: 0 0 6px; font-size: 15px; font-weight: 600;
    color: var(--text-light); line-height: 1.3;
  }
  
  .game-desc {
    font-size: 12px; color: var(--text-muted);
    line-height: 1.4; margin-bottom: 8px;
  }
  
  .game-meta-info {
    font-size: 11px; color: var(--text-muted);
    background: var(--bg-dark); padding: 6px 8px;
    border-radius: 6px; margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  
  .meta-row {
    display: flex; justify-content: space-between;
    padding: 2px 0;
  }
  
  .meta-label { color: var(--text-muted); }
  .meta-value { color: var(--text-light); font-weight: 600; }
  
  .game-genre {
    font-size: 11px; color: var(--accent);
    background: rgba(6, 182, 212, 0.15);
    padding: 2px 6px;
    border-radius: 3px; display: inline-block; margin-bottom: 8px;
    border: 1px solid rgba(6, 182, 212, 0.3);
  }
  
  .game-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px; font-size: 12px; margin-bottom: 8px;
  }
  
  .stat {
    display: flex; align-items: center; gap: 3px;
  }
  .stat-label { color: var(--text-muted); }
  .stat-value { color: var(--text-light); font-weight: 600; }
  
  .price-history {
    font-size: 10px; color: var(--text-muted); margin-bottom: 8px;
  }
  
  .price-section {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 8px; display: flex;
    justify-content: space-between; align-items: center;
    margin-top: auto;
  }
  
  .prices {
    display: flex; align-items: baseline; gap: 6px;
  }
  
  .price-now {
    font-size: 16px; font-weight: 700;
    color: #10b981;
  }
  
  .price-old {
    font-size: 12px; color: var(--text-muted);
    text-decoration: line-through;
  }
  
  .buy-btn {
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    background: var(--accent); color: white;
    border: none; border-radius: 6px; cursor: pointer;
    transition: background 0.2s;
  }
  .buy-btn:hover { background: var(--accent-hover); }
  
  .pagination {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin-top: 2rem; flex-wrap: wrap;
  }
  
  .page-info {
    font-size: 14px; font-weight: 600; color: var(--text-light);
  }
  
  .loadmore-btn {
    padding: 10px 20px; font-size: 14px; font-weight: 600;
    background: var(--surface-card); border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius); cursor: pointer;
    transition: all 0.2s; color: var(--text-light);
  }
  .loadmore-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--surface-hover);
  }
  .loadmore-btn:disabled {

  }

    text-align: center; padding: 3rem 1rem;
    color: var(--text-muted);
    grid-column: 1 / -1;
  }
  
  .empty-icon { font-size: 60px; margin-bottom: 1rem; }

    background: var(--surface-card); border: 1px solid rgba(255,255,255,0.1);

          <option value="adventure">모험</option>
          <option value="indie">인디</option>
        </select>
      </div>
    </div>
  </div>
  
  <div class="status-msg" id="statusMsg"></div>
  
  <div class="games-grid" id="gamesGrid"></div>
  
  <div class="pagination" id="pagination"></div>
</div>

      screenshotUrl: 'https://wsrv.nl/?url=https://cdn.cloudflare.steamstatic.com/steam/apps/683320/ss_b1d3e5a7c9e1f3a5c7e9f1a3c5e7f9a1c3e5a7.jpg&w=300&h=200&fit=cover',
      url: 'https://store.steampowered.com/app/683320/', isNew: false, prevPrice: 7.49 
    },
    { 
      title: 'The Witness', genre: 'puzzle', original: 39.99, price: 9.99, discount: 75, rating: 4.7, reviews: 4200, popularity: 78, 
      desc: '신비한 섬에서 깊이 있는 퍼즐을 풀며 세계의 비밀을 밝혀내세요', 
      playTime: '40-80시간', dev: 'Jonathan Blow', features: '퍼즐, 탐험, 철학적',
      screenshotUrl: 'https://wsrv.nl/?url=https://cdn.cloudflare.steamstatic.com/steam/apps/257200/ss_c2e4a6c8e0f2a4c6e8f0a2c4e6f8a0c2e4a6c8.jpg&w=300&h=200&fit=cover',
      url: 'https://store.steampowered.com/app/257200/', isNew: false, prevPrice: 14.99 
    }
  ];

  // 나머지는 그래디언트 배경 사용
  const gradientGames = [
    { title: 'Civilization VI', genre: 'strategy', original: 59.99, price: 14.99, discount: 75, rating: 4.6, reviews: 7654, popularity: 82, desc: '제국을 건설하고 세계 역사를 만들어보는 거대한 전략 시뮬레이션 게임', playTime: '50시간+', dev: 'Firaxis Games', features: '턴제전략, 역사, 멀티플레이', emoji: '👑', pattern: 'linear-gradient(135deg, #b91c1c, #fcd34d)', url: 'https://store.steampowered.com/app/289070/', isNew: false, prevPrice: 19.99 },
    { title: 'Among Us', genre: 'indie', original: 4.99, price: 2.49, discount: 50, rating: 4.3, reviews: 2100, popularity: 75, desc: '친구들과 함께 참과 거짓을 구분하는 소셜 디덕션 게임', playTime: '15-30분/판', dev: 'Innersloth', features: '멀티플레이, 스포츠', emoji: '👽', pattern: 'linear-gradient(135deg, #06b6d4, #1e40af)', url: 'https://store.steampowered.com/app/945360/', isNew: false, prevPrice: 3.99 },
  ];

  const allGames = [...topGames, ...gradientGames];

  // 더미 게임 추가 (남은 인벤토리용)
  for (let i = 0; i < 75; i++) {
    const base = allGames[i % allGames.length];
    const genreList = Object.keys(genres);
    const randomGenre = genreList[Math.floor(Math.random() * genreList.length)];
    allGames.push({
      ...base,
      title: `${base.title.split('(')[0].split('v')[0].trim()} v${i + 2}`,
      genre: randomGenre,
      discount: Math.max(40, base.discount - Math.floor(Math.random() * 20)),
      rating: Math.max(3.5, base.rating - Math.random() * 0.5),
      reviews: base.reviews + Math.floor(Math.random() * 5000),
      isNew: Math.random() > 0.7,
      prevPrice: base.original - Math.random() * 10,
      url: base.url + (i % 5)
    });
  }

  let currentPage = 0;
  let displayedGames = [];
  let currentTab = 'hotdeals';
  let wishlist = JSON.parse(localStorage.getItem('gameWishlist') || '[]');

  function renderGames() {
    const grid = document.getElementById('gamesGrid');
    const start = currentPage * 10;
    const end = start + 10;
    const games = displayedGames.slice(start, end);

    if (games.length === 0) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">🎮</div>게임을 검색해주세요!</div>';
      return;
    }

    grid.innerHTML = games.map((g) => {
      const isHotDeal = g.discount >= 70;
      const isWishlisted = wishlist.includes(g.title);
      const priceDrop = g.prevPrice - g.price;
      const wishlistIcon = isWishlisted ? '❤️' : '🤍';
      
      const thumbnailStyle = g.screenshotUrl 
        ? `background-image: url('${g.screenshotUrl}');` 
        : `background: ${g.pattern || 'linear-gradient(135deg, #1e293b, #334155)'}; display: flex; align-items: center; justify-content: center; font-size: 42px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);`;
      
      return `
        <div class="game-card">
          <div class="game-thumbnail" style="${thumbnailStyle}">
            ${!g.screenshotUrl ? `<div>${g.emoji || '🎮'}</div>` : ''}
            ${isHotDeal ? '<div class="hot-badge">🔥 HOT</div>' : ''}
            <button class="wishlist-btn" title="${isWishlisted ? '찜 해제' : '찜하기'}"
              onclick="toggleWishlist('${g.title}', event)">${wishlistIcon}</button>
            <div class="discount-badge">${g.discount}%</div>
          </div>
          <div class="game-content">
            ${g.isNew ? '<div class="game-genre" style="background: rgba(249, 115, 22, 0.2); border-color: rgba(249, 115, 22, 0.5); color: #fb923c;">NEW</div>' : '<div class="game-genre">' + genres[g.genre] + '</div>'}
            <div class="game-title">${g.title}</div>
            <div class="game-desc">${g.desc}</div>
            
            <div class="game-meta-info">
              <div class="meta-row">
                <span class="meta-label">⏱️ 플레이타임:</span>
                <span class="meta-value">${g.playTime}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">👤 개발사:</span>
                <span class="meta-value">${g.dev}</span>
              </div>
              <div class="meta-row">
                <span class="meta-label">✨ 특징:</span>
                <span class="meta-value">${g.features}</span>
              </div>
            </div>
            
            <div class="game-stats">
              <div class="stat"><span class="stat-label">⭐</span><span class="stat-value">${g.rating.toFixed(1)}</span></div>
              <div class="stat"><span class="stat-label">👥</span><span class="stat-value">${(g.reviews / 1000).toFixed(1)}k</span></div>
            </div>
            
            ${priceDrop > 0.5 ? `<div class="price-history">📉 지난주: $${g.prevPrice.toFixed(2)}</div>` : ''}
            
            <div class="price-section">
              <div class="prices">
                <div class="price-now">$${g.price.toFixed(2)}</div>
                <div class="price-old">$${g.original.toFixed(2)}</div>
              </div>
              <button class="buy-btn" onclick="buyGame('${g.url}')">구매</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    updatePagination();
  }

  function updatePagination() {
    const total = displayedGames.length;
    const pages = Math.ceil(total / 10);
    const pag = document.getElementById('pagination');

    pag.innerHTML = `
      <div class="page-info">페이지 ${currentPage + 1} / ${pages} (총 ${total}개)</div>
      <button class="loadmore-btn" 
        onclick="loadMore()"
        ${currentPage >= pages - 1 ? 'disabled' : ''}>
        ${currentPage >= pages - 1 ? '마지막 페이지입니다' : '더보기 (다음 10개)'}
      </button>
    `;
  }

  function loadMore() {
    const total = displayedGames.length;
    if ((currentPage + 1) * 10 < total) {
      currentPage++;
      renderGames();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function buyGame(url) {
    window.open(url, '_blank');
  }

  function toggleWishlist(title, event) {
    event.stopPropagation();
    const index = wishlist.indexOf(title);
    if (index > -1) {
      wishlist.splice(index, 1);
    } else {
      wishlist.push(title);
    }
    localStorage.setItem('gameWishlist', JSON.stringify(wishlist));
    renderGames();
  }

  function sortAndFilter() {
    const sortBy = document.getElementById('sortBy').value;
    const genre = document.getElementById('filterGenre').value;

    let filtered = allGames.filter(g => !genre || g.genre === genre);

    if (currentTab === 'hotdeals') {
      filtered = filtered.filter(g => g.discount >= 50);
    } else if (currentTab === 'trending') {
      filtered = filtered.sort((a, b) => b.popularity - a.popularity);
    } else if (currentTab === 'new') {
      filtered = filtered.filter(g => g.isNew);
    } else if (currentTab === 'wishlist') {
      filtered = filtered.filter(g => wishlist.includes(g.title));
    }

    filtered.sort((a, b) => {
      if (sortBy === 'discount') return b.discount - a.discount;
      if (sortBy === 'price-low') return a.price - b.price;
      if (sortBy === 'price-high') return b.price - a.price;
      if (sortBy === 'rating') return b.rating - a.rating;
      if (sortBy === 'popularity') return b.popularity - a.popularity;
      return 0;
    });

    displayedGames = filtered;
    currentPage = 0;
    renderGames();
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentTab = this.dataset.tab;
      currentPage = 0;
      sortAndFilter();
    });
  });

  document.getElementById('searchBtn').addEventListener('click', function() {
    const status = document.getElementById('statusMsg');
    status.textContent = '🎮 오늘의 핫딜을 검색 중...';
    
    setTimeout(() => {
      currentTab = 'hotdeals';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('[data-tab="hotdeals"]').classList.add('active');
      sortAndFilter();
      status.textContent = `✨ ${displayedGames.length}개의 게임 할인정보를 찾았어요!`;
    }, 600);
  });

  document.getElementById('sortBy').addEventListener('change', sortAndFilter);
  document.getElementById('filterGenre').addEventListener('change', sortAndFilter);

  sortAndFilter();
</script>
